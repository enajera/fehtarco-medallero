version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: medallero-postgres
    environment:
      POSTGRES_USER: medallero_user
      POSTGRES_PASSWORD: medallero_password
      POSTGRES_DB: medallero_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medallero_user -d medallero_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
